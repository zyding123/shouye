name: macOS regression and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Isolated regression tests
        run: |
          export SWIFTC="$(xcrun --find swiftc)"
          export SDK_PATH="$(xcrun --show-sdk-path)"
          python3 tests/run-tests.py
      - name: Build and verify signatures
        run: |
          ./build.sh
          codesign --verify --deep --strict --verbose=2 build/守夜.app
